<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizTone Converter - 업무 말투 변환기</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>BizTone Converter</h1>
        <p>일상적인 문장을 비즈니스 상황에 맞는 전문적인 말투로 변환해 드립니다.</p>
        
        <!-- 기능 구현은 Sprint 2에서 진행될 예정입니다. -->
        <div class="converter-wrapper">
            <div class="input-area">
                <h2>원문 입력</h2>
                <textarea id="inputText" placeholder="여기에 변환할 텍스트를 입력하세요..."></textarea>
            </div>
            <div class="output-area">
                <h2>변환 결과</h2>
                <div id="outputText"></div>
            </div>
        </div>
        
        <div class="options">
            <select id="personaSelector">
                <option value="upward">상사에게</option>
                <option value="lateral">동료에게</option>
                <option value="external">고객에게</option>
            </select>
            <button id="convertButton">변환하기</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
