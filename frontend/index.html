<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizTone Converter - 업무 말투 변환기</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-secondary flex justify-center items-start min-h-screen p-4 sm:p-6 md:p-8">
    <div class="container bg-white rounded-xl shadow-lg p-6 sm:p-8 md:p-10 w-full max-w-4xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-primary">BizTone Converter</h1>
            <p class="text-text/80 mt-2 text-sm sm:text-base">일상적인 문장을 비즈니스 상황에 맞는 전문적인 말투로 변환해 드립니다.</p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="input-area">
                <h2 class="text-lg font-semibold mb-3 text-text">원문 입력</h2>
                <textarea id="inputText" placeholder="여기에 변환할 텍스트를 입력하세요..." class="w-full h-60 p-3 border border-border rounded-md focus:ring-2 focus:ring-primary focus:border-primary transition duration-200 resize-none"></textarea>
            </div>
            <div class="output-area">
                <h2 class="text-lg font-semibold mb-3 text-text">변환 결과</h2>
                <div id="outputText" class="w-full h-60 p-3 border border-border rounded-md bg-gray-50 overflow-y-auto"></div>
            </div>
        </div>
        
        <div class="options flex flex-col sm:flex-row justify-end items-center mt-6 gap-4">
            <select id="personaSelector" class="w-full sm:w-auto px-4 py-3 text-base border border-border rounded-md focus:ring-2 focus:ring-primary focus:border-primary transition duration-200">
                <option value="upward">상사에게</option>
                <option value="lateral">동료에게</option>
                <option value="external">고객에게</option>
            </select>
            <button id="convertButton" class="w-full sm:w-auto bg-primary text-white font-bold py-2 px-6 rounded-md hover:bg-blue-600 transition-colors duration-200 disabled:bg-gray-400">변환하기</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
